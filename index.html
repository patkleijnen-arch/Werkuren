<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#0f172a">
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="icon-192.png">
    <title>Uren Registratie</title>
    <link rel="stylesheet" href="style.css?v=29">
    <link rel="manifest" href="manifest.json">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script></head>
<body>
    <div class="app-container">
        <!-- Header -->
        <header class="app-header">
            <h1 style="flex: 1; text-align: left; display: flex; align-items: center; gap: 8px;">
                <i id="settings-trigger" class="fa-solid fa-clock" style="cursor: pointer; color: var(--primary);" title="Instellingen"></i>
                Werkuren
            </h1>
            <div style="flex: 1; display: flex; justify-content: center;">
                <button id="stats-btn" class="icon-btn" style="background: rgba(14, 165, 233, 0.2); color: #38bdf8; border: 1px solid rgba(14, 165, 233, 0.4); border-radius: 8px; width: 36px; height: 36px; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: all 0.2s;"><i class="fa-solid fa-chart-column"></i></button>
            </div>
            <div style="flex: 1; display: flex; justify-content: flex-end;">
                <button id="add-btn" class="add-btn-header"><i class="fa-solid fa-plus"></i> Uren invoeren</button>
            </div>
        </header>

        <!-- Main Content (List of hours) -->
        <main id="dashboard" class="page active">
            <div id="loading" class="loading-state hidden">
                <div class="spinner"></div>
                <p>Uren laden...</p>
            </div>
            <div id="empty-state" class="empty-state hidden">
                <i class="fa-solid fa-calendar-times"></i>
                <p>Nog geen uren geregistreerd.</p>
            </div>
            <!-- Sticky Dashboard Header -->
            <div id="sticky-dashboard-header" style="position: sticky; top: 0; z-index: 40; background: var(--bg-color); margin: 0 -16px; padding: 4px 16px 8px 16px; margin-bottom: 0px;">
                <!-- Grand Totals -->
                <div id="grand-totals" class="grand-totals hidden" style="position: relative; top: 0; z-index: auto; margin-bottom: 8px;">
                    <!-- Injected via JS -->
                </div>

                <!-- View Controls -->
                <div id="view-controls" class="view-controls hidden">
                    <div style="display: flex; gap: 8px; width: 100%;">
                        <button class="view-btn active" data-view="week">Per Week</button>
                        <button class="view-btn" data-view="month">Per Maand</button>
                        <button id="select-mode-btn" style="flex-shrink: 0; padding: 6px 12px; font-size: 0.85rem; border: 1px solid var(--primary); color: var(--primary); background: rgba(59, 130, 246, 0.1); border-radius: 8px; cursor: pointer; transition: all 0.2s;"><i class="fa-solid fa-share-from-square"></i> Delen...</button>
                    </div>
                </div>


            </div>

            <ul id="hours-list" class="hours-list hidden">
                <!-- Items will be injected here via JS -->
            </ul>
        </main>

        <!-- Add/Edit Form -->
        <!-- Add Form Modal (Slide Up) -->
        <div id="add-form-page" class="slide-modal">
            <div class="glass-card" style="border-radius: 0; padding: 24px 16px; display: flex; flex-direction: column; height: 100%;">
                
                
                <form id="hours-form" style="display: flex; flex-direction: column; justify-content: space-evenly; flex: 1;">
                    <div class="form-group">
                        <label style="color: var(--text-muted); font-size: 0.8rem; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 2px; display: block; text-align: center;">Werklocatie</label>
                        <div class="location-chips" style="display: flex; gap: 10px; width: 100%;">
                            <label class="loc-chip">
                                <input type="radio" name="location_radio" value="Plus Bocholtz">
                                <span><i class="fa-solid fa-store" style="margin-right: 6px;"></i> Plus Bocholtz</span>
                            </label>
                            <label class="loc-chip">
                                <input type="radio" name="location_radio" value="Kruidvat">
                                <span><i class="fa-solid fa-pump-soap" style="margin-right: 6px;"></i> Kruidvat</span>
                            </label>
                            <input type="hidden" id="location" value="">
                        </div>
                    </div>
                    
                    <div class="form-group">
                        <label style="color: var(--text-muted); font-size: 0.8rem; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 2px; display: block; text-align: center;">Datum</label>
                        <div class="input-wrapper" style="display: flex; align-items: center; background: rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; padding: 0 16px; transition: all 0.3s;">
                            <i class="fa-solid fa-calendar-day" style="color: var(--primary); font-size: 1.2rem; width: 24px; text-align: center; margin-right: 12px;"></i>
                            <input type="date" id="date" onclick="if(this.showPicker) this.showPicker();" style="background: transparent; border: none; color: white; padding: 16px 0; width: 100%; outline: none; font-size: 1.1rem; font-family: inherit;">
                        </div>
                    </div>
                    
                    <div class="time-row" style="background: rgba(0,0,0,0.2); padding: 20px 16px; border-radius: 12px; display: flex; gap: 12px; align-items: center; border: 1px solid rgba(255,255,255,0.05);">
                        <div class="form-group" style="margin-bottom: 0; flex: 1;">
                            <label style="color: var(--text-muted); font-size: 0.8rem; text-transform: uppercase; margin-bottom: 2px; display: block; text-align: center;">Starttijd</label>
                            <div style="display: flex; align-items: center; background: rgba(255,255,255,0.05); border-radius: 12px; padding: 0 12px;">
                                <i class="fa-solid fa-play" style="color: #10b981; font-size: 0.9rem; margin-right: 8px;"></i>
                                <input type="time" id="start-time" onclick="if(this.showPicker) this.showPicker();" style="background: transparent; border: none; color: white; padding: 12px 0; width: 100%; outline: none; font-size: 1.1rem; font-family: inherit;">
                            </div>
                        </div>
                        <div style="color: var(--text-muted); margin-top: 16px;">
                            <i class="fa-solid fa-arrow-right"></i>
                        </div>
                        <div class="form-group" style="margin-bottom: 0; flex: 1;">
                            <label style="color: var(--text-muted); font-size: 0.8rem; text-transform: uppercase; margin-bottom: 2px; display: block; text-align: center;">Eindtijd</label>
                            <div style="display: flex; align-items: center; background: rgba(255,255,255,0.05); border-radius: 12px; padding: 0 12px;">
                                <i class="fa-solid fa-stop" style="color: #ef4444; font-size: 0.9rem; margin-right: 8px;"></i>
                                <input type="time" id="end-time" onclick="if(this.showPicker) this.showPicker();" style="background: transparent; border: none; color: white; padding: 12px 0; width: 100%; outline: none; font-size: 1.1rem; font-family: inherit;">
                            </div>
                        </div>
                    </div>
                    
                    <!-- Live Duration -->
                    <div id="live-duration" style="text-align: center; margin: -4px 0 24px 0; font-size: 2.5rem; font-weight: 800; color: #fff; display: none; text-shadow: 0 0 20px rgba(56, 189, 248, 0.8), 0 0 10px rgba(56, 189, 248, 0.4);">
                        0,00 <span style="font-size: 1rem; font-weight: 600; opacity: 0.8; vertical-align: middle;">uur</span>
                    </div>

                    <div class="form-group">
                        <label style="color: var(--text-muted); font-size: 0.8rem; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 2px; display: block; text-align: center;">Pauze gehad?</label>
                        <div class="location-chips" style="display: flex; gap: 10px; width: 100%;">
                            <label class="loc-chip">
                                <input type="radio" name="break_radio" value="Ja">
                                <span><i class="fa-solid fa-mug-saucer" style="margin-right: 6px;"></i> Ja</span>
                            </label>
                            <label class="loc-chip">
                                <input type="radio" name="break_radio" value="Nee">
                                <span><i class="fa-solid fa-ban" style="margin-right: 6px;"></i> Nee</span>
                            </label>
                            <input type="hidden" id="break-val" value="">
                        </div>
                    </div>

                    <div class="form-group">
                        <label style="color: var(--text-muted); font-size: 0.8rem; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 2px; display: block; text-align: center;">Opmerkingen</label>
                        <div class="input-wrapper" style="display: flex; align-items: flex-start; background: rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; padding: 6px 10px; transition: all 0.3s;">
                            <i class="fa-solid fa-comment-dots" style="color: var(--primary); font-size: 1.2rem; width: 24px; text-align: center; margin-right: 12px; margin-top: 2px;"></i>
                            <textarea id="notes" rows="1" placeholder="Wat heb je gedaan? (optioneel)" style="background: transparent; border: none; color: white; width: 100%; outline: none; font-size: 1rem; font-family: inherit; resize: none;"></textarea>
                        </div>
                    </div>
                    <div class="form-actions" style="display: grid; grid-template-columns: 1fr 2fr; gap: 12px;">
                        <button type="button" id="cancel-btn" class="btn btn-secondary">Terug</button>
                        <button type="submit" id="save-btn" class="btn btn-primary" style="font-size: 1.1rem;">Opslaan</button>
                    </div>
                </form>
            </div>
        </div>
        
        <!-- Setup Guide Screen (Shown when API URL is not set) -->
        <main id="setup-page" class="page">
            <div class="glass-card">
                <h2>Welkom! 👋</h2>
                <p>Om deze app te gebruiken, moeten we hem koppelen aan jouw Google Spreadsheet.</p>
                <div class="form-group">
                    <label for="api-url">Google Apps Script Web App URL:</label>
                    <input type="url" id="api-url" placeholder="https://script.google.com/macros/s/.../exec">
                </div>
                <button id="save-api-btn" class="btn btn-primary w-100">Koppel App</button>
                <p class="setup-help">Bekijk de instructies over hoe je deze URL kunt krijgen.</p>
            </div>
        </main>
        
        <!-- Global Export Controls -->
        <div id="print-controls" class="print-controls hidden"><button id="print-btn" class="btn btn-secondary" style="font-size: 1rem; padding: 12px;">
                <i class="fa-solid fa-share-from-square"></i> <span id="print-btn-text">Alles Exporteren</span>
            </button>
        </div>
        
        <!-- Export Modal -->
        <div id="print-modal" class="modal hidden">
            <div class="glass-card modal-content" style="text-align: center;">
                <h2 style="margin-top:0;"><i class="fa-solid fa-share-from-square"></i> Uren Exporteren</h2>
                
                <div class="form-group" style="margin: 20px 0; text-align: left; background: rgba(0,0,0,0.2); padding: 16px; border-radius: 12px;">
                    <label style="display: flex; align-items: center; gap: 12px; cursor: pointer; color: white;">
                        <input type="checkbox" id="export-notes-toggle" checked style="width: 20px; height: 20px; accent-color: var(--primary);">
                        <span>Inclusief opmerkingen & pauzes</span>
                    </label>
                </div>
                
                <div style="display: flex; flex-direction: column; gap: 12px;">
                    <button type="button" id="export-excel-btn" class="btn btn-primary" style="background: linear-gradient(135deg, #10b981, #059669);">
                        <i class="fa-solid fa-file-excel"></i> Deel als Excel (.csv)
                    </button>
                    <button type="button" id="export-pdf-btn" class="btn btn-primary" style="background: linear-gradient(135deg, #ef4444, #b91c1c);">
                        <i class="fa-solid fa-file-pdf"></i> Deel als PDF
                    </button>
                    <button type="button" id="export-print-btn" class="btn btn-secondary">
                        <i class="fa-solid fa-print"></i> Gewoon Printen
                    </button>
                    <button type="button" id="print-cancel-btn" class="btn btn-secondary" style="margin-top: 12px; background: transparent;">
                        Annuleren
                    </button>
                </div>
                
                <!-- Hidden inputs for backward compatibility with app.js?v=4 until we update it -->
                <button type="button" id="print-yes-btn" style="display:none;"></button>
                <button type="button" id="print-no-btn" style="display:none;"></button>
                <input type="checkbox" id="print-notes-toggle" style="display: none;">
            </div>
        </div>
        
        <!-- Toast Notification -->
        <div id="toast" class="toast hidden">
            <i id="toast-icon" class="fa-solid fa-circle-check"></i>
            <span id="toast-msg">Succes!</span>
        </div>
    </div>
    
    <!-- Hidden Print Container -->
    <div id="print-container" class="print-only"></div>
    
        <!-- Stats Modal (Slide Up) -->
        <div id="stats-page" class="slide-modal">
            <div class="glass-card" style="border-radius: 0; padding: 24px 16px; display: flex; flex-direction: column; height: 100%;">
                
                
                
                <h3 style="color: var(--primary); font-size: 1.2rem; margin-bottom: 8px; text-align: center;">Uren per Week</h3>
                <div style="background: rgba(0,0,0,0.2); padding: 16px; border-radius: 12px; flex: 1; display: flex; align-items: center; justify-content: center; min-height: 0;">
                    <canvas id="weekChart" style="height: 100%; width: 100%; max-height: 35vh;"></canvas>
                </div>

                <h3 style="color: var(--primary); font-size: 1.2rem; margin-bottom: 8px; text-align: center;">Uren per Maand</h3>
                <div style="background: rgba(0,0,0,0.2); padding: 16px; border-radius: 12px; flex: 1; display: flex; align-items: center; justify-content: center; min-height: 0;">
                    <canvas id="monthChart" style="height: 100%; width: 100%; max-height: 35vh;"></canvas>
                </div>

                <button id="close-stats-btn" class="btn btn-secondary" style="flex: none; width: auto; padding: 10px 24px; font-size: 1rem; margin: auto auto 0 auto; display: block;">Sluiten</button>
            </div>
        </div>
    
    <script src="app.js?v=46"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('./sw.js').then(reg => {
            console.log('Service Worker geregistreerd!', reg);
          }).catch(err => {
            console.log('Service Worker registratie mislukt:', err);
          });
        });
      }
    </script>
</body>
</html>
